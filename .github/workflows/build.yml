# Build mínimo para la capa gratuita de GitHub.
# Solo Windows, sin matrix, con caché y cancelación.
# fmt siempre; clippy+test solo si cambia código Rust; build release siempre.
# El PC local no compila nada: solo `git push` y descargar el .exe de Actions.

name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Historial completo: el paso de detección compara con el commit base.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Solo main guarda caché; los PR reutilizan el de main.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # clippy y test solo valen minutos cuando hay código que revisar:
      # si el push solo toca docs, se saltan y el job es restore + build.
      - name: Detect Rust changes
        id: rust-changes
        shell: pwsh
        run: |
          $changed = "true"
          try {
            $base = "${{ github.event.before }}"
            if ("${{ github.event_name }}" -eq "pull_request") { $base = "${{ github.event.pull_request.base.sha }}" }
            if ("${{ github.event_name }}" -eq "workflow_dispatch") { $base = "" }
            if ($base -and $base -notmatch "^0+$") {
              $files = @(git diff --name-only $base "${{ github.sha }}" -- src Cargo.toml Cargo.lock)
              $changed = ($files.Count -gt 0).ToString().ToLower()
            }
          } catch { $changed = "true" }
          "changed=$changed" >> $env:GITHUB_OUTPUT
          Write-Host "Rust changed: $changed"
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        if: steps.rust-changes.outputs.changed == 'true'
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        if: steps.rust-changes.outputs.changed == 'true'
        run: cargo test
      - name: Build release
        # Sin --locked: el Cargo.lock se resuelve en el runner y el PC local
        # nunca compila. `--locked` abortaría si el lock va desfasado.
        run: cargo build --release
      - name: Upload exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pngtuber-lite-windows-x86_64
          path: target/release/pngtuber-lite.exe
          if-no-files-found: error
          retention-days: 7
