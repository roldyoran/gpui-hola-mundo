[package]
name = "pngtuber-lite"
version = "0.1.0"
edition = "2024"
description = "PNGTuber ultraligero: overlay transparente y VAD por RMS con GPUI"
license = "MIT"

[dependencies]
# GPUI + plataforma, sin la librería de componentes ni los assets del Kit.
gpui-kit = { version = "0.11.0", default-features = false }

# Captura de micrófono (WASAPI en Windows).
cpal = "0.18.2"

# Persistencia de ajustes.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Diálogo nativo de archivos sin GTK/portal/wayland en Windows.
rfd = { version = "0.18.0", default-features = false, features = ["common-controls-v6"] }

# Puente audio -> UI sin polling.
async-channel = "2.5"

# HWND a partir de la ventana de GPUI (misma versión que usa GPUI).
raw-window-handle = "0.6"

anyhow = "1"

[target.'cfg(windows)'.dependencies]
# Solo el shim de arrastre, captura para OBS y "siempre visible". Misma versión que GPUI.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Com",
] }

[profile.release]
# Binario pequeño y arranque rápido; el CI es quien compila.
opt-level = 3
strip = true
lto = "thin"
codegen-units = 1
